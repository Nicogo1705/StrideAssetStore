name: "Build & test the solution"
run-name: "Building and testing on Windows, Linux and macOS"

# Build the whole solution and run the tests on every push to main and every PR. Release tags are
# covered by release.yml's own test job, which gates the publish. This workflow deliberately does not
# run on tags: it could only ever run alongside the release, never in front of it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs on the same ref, so only the latest push is built.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Three OSes, because half of what this codebase does is filesystem and process work whose rules
  # differ per platform: case-sensitive path matching, executable bits, how a child process is
  # detached. Those bugs are invisible on one runner and obvious on three.
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The schema, validator and index-builder tests read the registry's schemas from a sibling
      # checkout. Without it they returned early and were reported green — every one of them has
      # been a no-op in CI. TestPaths now refuses to skip when CI is set, so a missing checkout
      # fails the run instead of hiding it.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Nicogo1705/AssetContainer
          path: AssetContainer

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      # No packages.lock.json in the repo, so setup-dotnet's `cache: true` can't be used;
      # cache the global packages folder keyed on the project files instead.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

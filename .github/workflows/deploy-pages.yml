name: "Publish the storefront to GitHub Pages"

# Publishes the Blazor WASM store to GitHub Pages on every push to main.
# Requires Pages to be enabled with "GitHub Actions" as the source (repo Settings → Pages).
# Note: GitHub Pages on a private repo needs a paid plan; otherwise make the repo public.

on:
  push:
    branches: [main]
    paths:
      - "src/StrideAssetStore.App/**"
      - "src/StrideAssetStore.UI/**"
      - "src/StrideAssetStore.Core/**"
      - "src/StrideAssetStore.Cli/**" # generate-pages runs in this workflow
      - "Directory.Build.props"
      - "Directory.Build.targets" # decides how Version is stamped
      - ".github/workflows/deploy-pages.yml"
  schedule:
    # Daily, after AssetContainer's 06:00 index refresh: regenerates the per-asset
    # OG/SEO snapshot pages so new assets get shareable link previews within a day.
    - cron: "45 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # the site version comes from the latest v* tag

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      # Same version source as the desktop releases: the latest v* tag. Without this the WASM
      # footer would show the stale Directory.Build.props fallback forever.
      - name: Site version from latest tag
        id: ver
        run: |
          TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Site version: ${TAG#v}"

      - name: Publish
        run: dotnet publish src/StrideAssetStore.App/StrideAssetStore.App.csproj -c Release -o publish -p:Version=${{ steps.ver.outputs.version || '1.0.0' }}

      # Project pages are served under /<repo>/, so the SDK's <base href="/"> has to be rewritten or
      # every route 404s. Derived from the repository, and verified: an sed that stops matching (the
      # SDK dropping the self-closing space, say) would otherwise ship a broken site on a green run.
      - name: Rewrite base href for project pages
        run: |
          BASE="/${GITHUB_REPOSITORY#*/}/"
          sed -i -E "s|<base href=\"/\" ?/?>|<base href=\"$BASE\" />|" publish/wwwroot/index.html
          grep -q "<base href=\"$BASE\"" publish/wwwroot/index.html || {
            echo "::error::base href was not rewritten to $BASE — the published site would 404 on every route."
            grep -o '<base[^>]*>' publish/wwwroot/index.html || echo "(no <base> tag at all)"
            exit 1
          }

      # app.css and interop.js live outside the WebAssembly payload, so a browser keeps them across
      # deploys. That matters most for interop.js: its contract changes with the C# that calls it
      # (assetStoreEnv.copy returns a boolean now), and a stale copy makes every copy button report
      # failure. Stamped with the release version, and verified like the base href.
      - name: Version the static assets
        run: |
          # The commit, not the release tag: this workflow runs on a push to main, so when a release
          # is cut by pushing commits and then the tag, the tag doesn't exist yet and the assets got
          # stamped with the PREVIOUS version — leaving returning visitors on the old interop.js,
          # which is the failure this stamping exists to prevent. Observed on the v0.9.9 deploy.
          V="${GITHUB_SHA::8}"
          for f in "app.css" "js/interop.js"; do
            sed -i "s|_content/StrideAssetStore.UI/$f\"|_content/StrideAssetStore.UI/$f?v=$V\"|g" publish/wwwroot/index.html
            grep -q "_content/StrideAssetStore.UI/$f?v=$V\"" publish/wwwroot/index.html || {
              echo "::error::$f was not versioned - a stale browser copy would be served against new markup."
              grep -o "_content/StrideAssetStore.UI/[^\"]*" publish/wwwroot/index.html || true
              exit 1
            }
          done

      - name: Generate per-asset OG pages + sitemap
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Nicogo1705/AssetContainer/main/index.lock.json" -o index.lock.json
          dotnet run --project src/StrideAssetStore.Cli/StrideAssetStore.Cli.csproj -c Release -- \
            generate-pages --index index.lock.json --out publish/wwwroot \
            --app-index publish/wwwroot/index.html \
            --site "https://$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]').github.io/${GITHUB_REPOSITORY#*/}"

      - name: SPA fallback + disable Jekyll
        run: |
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

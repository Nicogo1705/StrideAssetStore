name: "Install an asset and run a Stride game (Win/Linux/macOS)"
run-name: "Installing ${{ github.event.inputs.asset || 'placeholder' }} into a Stride game and photographing it"

# Proves the promise the store makes, on every OS it claims to support: install the CLI, use it to
# add a published asset to a real Stride game, compile it, and run the game until it renders.
#
# Every step is named so a failure says WHICH promise broke — packaging, install, restore, compile
# or run — instead of "the workflow is red". That distinction is the whole point: the store can
# look perfectly healthy while its assets are impossible for a stranger to restore.
#
# The asset is installed the normal way, into the shared per-machine cache. Cloning inside the
# game's own folder (--into) makes the asset compiler see the package twice and is not what the
# default install does, so testing it would measure a path nobody takes.
#
# The game puts a cube on screen wearing a texture FROM the asset, and saves the frame as a PNG
# uploaded on every run. That is the difference between "the content compiled" and "the content
# loads": the old test rendered an empty blue screen, so an asset whose textures were unusable at
# runtime passed it without a word. Now the game dies at Content.Load if they are, and when it
# doesn't, there is a picture a human can look at — one per operating system.
#
# The default asset is therefore a texture pack (real .sdpkg, RootAssets, a content bundle). Point
# `asset` at a code-only asset and leave `texture` empty: the cube renders plain, and the run still
# proves install → restore → compile → run on that asset.
#
# Known limits, deliberately not hidden:
#  - GitHub runners have no GPU. Linux renders through Mesa's software rasteriser under Xvfb.
#  - Stride's runtime support is strongest on Windows; the Linux and macOS legs run anyway
#    rather than being quietly dropped, because that is what the store claims to support.

on:
  push:
    branches: [main]
    paths:
      - "src/StrideAssetStore.Cli/**"
      - "src/StrideAssetStore.Core.Local/**"
      - "src/StrideAssetStore.Core/**"
      - ".github/workflows/asset-e2e.yml"
  schedule:
    # Weekly: the asset repositories move on their own, so this catches breakage nobody pushed here.
    - cron: "30 7 * * 1"
  workflow_dispatch:
    inputs:
      asset:
        description: "Asset to install (id or unambiguous fragment)"
        default: "placeholder"
      texture:
        description: "Content URL of a texture in that asset, drawn on the cube (no leading slash). 'none' = plain cube."
        default: "StridePlaceholderTextures/UVGrid"
      stride:
        description: "Stride version the test game uses (must exist on nuget.org)"
        default: "4.4.0-beta5"

permissions:
  contents: read

env:
  ASSET: ${{ github.event.inputs.asset || 'placeholder' }}
  STRIDE: ${{ github.event.inputs.stride || '4.4.0-beta5' }}
  # Read by the test game at runtime rather than baked into its source: the heredoc below is
  # quoted so C# interpolation survives, which also means nothing in it can be substituted.
  # A plain `||` fallback, not a comparison with '': on a push or a cron there is no inputs object
  # at all, and `null == ''` is TRUE in a GitHub expression — which would have quietly dropped the
  # texture on precisely the runs nobody triggers by hand. Say 'none' to mean "no texture".
  #
  # And no leading slash, though the engine wants one: these steps run under Git Bash on Windows,
  # whose MSYS layer rewrites anything that looks like an absolute POSIX path before handing it to
  # a native process — "/StridePlaceholderTextures/UVGrid" reached the game as
  # "C:/Program Files/Git/StridePlaceholderTextures/UVGrid". The game puts the slash back.
  E2E_TEXTURE: ${{ github.event.inputs.texture || 'StridePlaceholderTextures/UVGrid' }}

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      # NuGet verifies package signatures against the OS trust store, and Ubuntu's does not carry
      # the roots NuGet signs with — unrelated to the packages themselves, and it fails the restore.
      - name: Linux — NuGet signature verification off
        if: runner.os == 'Linux'
        run: echo "DOTNET_NUGET_SIGNATURE_VERIFICATION=false" >> "$GITHUB_ENV"

      # Stride 4.4 renders through Vulkan off Windows, and macOS has no Vulkan of its own: it needs
      # MoltenVK, the Vulkan-on-Metal layer, which the runner image does not ship. Without it SDL
      # cannot even create the window ("Failed to load Vulkan Portability library").
      - name: Vulkan on macOS (MoltenVK)
        if: runner.os == 'macOS'
        run: |
          brew install --quiet molten-vk
          PREFIX="$(brew --prefix molten-vk)"
          {
            echo "DYLD_LIBRARY_PATH=$PREFIX/lib"
            echo "VK_ICD_FILENAMES=$PREFIX/share/vulkan/icd.d/MoltenVK_icd.json"
          } >> "$GITHUB_ENV"

      - name: Graphics stack for a headless Linux runner
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # llvmpipe/lavapipe render on the CPU; SDL2 is how Stride opens its window.
          sudo apt-get install -y --no-install-recommends \
            xvfb mesa-utils libgl1 libglx-mesa0 libvulkan1 mesa-vulkan-drivers libsdl2-2.0-0 libopenal1

      # ── 1. The tool has to package and install like a user's would ──
      - name: Pack and install the CLI as a global tool
        run: |
          dotnet pack src/StrideAssetStore.Cli/StrideAssetStore.Cli.csproj -c Release -p:Version=0.0.1-ci -o nupkg
          dotnet tool install StrideAssetStore --version 0.0.1-ci --add-source nupkg --tool-path tools
          tools/strideassetstore --version

      # ── 2. A code-only Stride game: no Game Studio, no .sdpkg, just a project ──
      # Built OUTSIDE the checkout on purpose: inside it, the game would inherit this repository's
      # Directory.Build.props (TreatWarningsAsErrors), and Stride's build chain pulls transitive
      # packages with published advisories — the test game would fail on OUR policy, telling us
      # nothing about the store. A user's game has its own settings anyway.
      - name: Scaffold a Stride game
        run: |
          GAME="$RUNNER_TEMP/game"
          mkdir -p "$GAME"

          # Stride picks its graphics API from StridePlatform (Stride.Graphics.targets): Windows
          # means Direct3D11, Linux and macOS mean Vulkan. A project that never sets it passes for
          # Windows everywhere, and the game dies looking for Silk.NET.DXGI on a machine that has
          # no DXGI. Stride 4.4 has no OpenGL backend, so Vulkan is the option off Windows.
          case "${{ runner.os }}" in
            Windows) PLATFORM=Windows ;;
            Linux)   PLATFORM=Linux ;;
            macOS)   PLATFORM=macOS ;;
          esac
          cat > "$GAME/Game.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <!-- The store's assets target net10.0; a lower TFM fails to reference them (NU1201). -->
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <StridePlatform>${PLATFORM}</StridePlatform>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Stride.Engine" Version="${STRIDE}" />
              <!-- Renamed from Stride.Core.Assets.CompilerApp in 4.4. This is what compiles the
                   assets at build time; without it the game builds but ships no content. -->
              <PackageReference Include="Stride.AssetCompiler" Version="${STRIDE}" IncludeAssets="build;buildTransitive" />
            </ItemGroup>
          </Project>
          EOF
          # Plain Stride, no community toolkit: the toolkit pins its own Stride generation, so the
          # test would be measuring the toolkit's compatibility rather than the store's.
          cat > "$GAME/Program.cs" <<'EOF'
          using Stride.Core.Mathematics;
          using Stride.Engine;
          using Stride.Games;
          using Stride.Graphics;
          using Stride.Rendering;
          using Stride.Rendering.Compositing;
          using Stride.Rendering.Lights;
          using Stride.Rendering.Materials;
          using Stride.Rendering.Materials.ComputeColors;
          using Stride.Rendering.ProceduralModels;

          using var game = new E2EGame();
          game.Run();

          sealed class E2EGame : Game
          {
              // Assets of a referenced package are addressed as /<package>/<asset>, leading slash
              // included, which the engine is strict about — but the variable arrives without it,
              // because Git Bash would rewrite an absolute POSIX path into a Windows one on its
              // way to a native process. So it is added here. "none" (or nothing) means the asset
              // has no texture to draw, and the cube renders plain rather than the run being
              // skipped: install, restore, compile and run are still worth proving for it.
              private static readonly string? TextureUrl =
                  Environment.GetEnvironmentVariable("E2E_TEXTURE") is { Length: > 0 } url
                  && !url.Equals("none", StringComparison.OrdinalIgnoreCase)
                      ? "/" + url.TrimStart('/')
                      : null;

              private int _frames;

              // Built in LoadContent, not Initialize: a Texture deserialises straight into a GPU
              // resource, and asking for one before the graphics device is up dies inside
              // Texture.ConvertToNativeDescription2D with a null reference that explains nothing.
              protected override async Task LoadContent()
              {
                  await base.LoadContent();

                  // A bare Game has no GameSettings and no GraphicsCompositor, so nothing is ever
                  // drawn: the window opens black and Draw is never reached. Build the minimum.
                  SceneSystem.GraphicsCompositor = GraphicsCompositorHelper.CreateDefault(true, clearColor: Color.CornflowerBlue);
                  var scene = new Scene();

                  var camera = new Entity("Camera")
                  {
                      new CameraComponent { Slot = SceneSystem.GraphicsCompositor.Cameras[0].ToSlotId() },
                  };
                  camera.Transform.Position = new Vector3(0, 0, 3);
                  scene.Entities.Add(camera);

                  var light = new Entity("Light") { new LightComponent { Intensity = 1.5f, Type = new LightDirectional() } };
                  light.Transform.Rotation = Quaternion.RotationYawPitchRoll(
                      MathUtil.DegreesToRadians(-30), MathUtil.DegreesToRadians(-45), 0);
                  scene.Entities.Add(light);

                  // Ambient as well as directional: with one light half the cube is black, and a
                  // face nobody can see is a face the picture cannot vouch for.
                  scene.Entities.Add(new Entity("Ambient")
                  {
                      new LightComponent { Intensity = 0.35f, Type = new LightAmbient() },
                  });

                  var attributes = new MaterialAttributes { DiffuseModel = new MaterialDiffuseLambertModelFeature() };
                  if (TextureUrl is not null)
                  {
                      // The line the whole test exists for: this texture is only addressable because
                      // the store installed the asset and its content was compiled into the game.
                      var texture = Content.Load<Texture>(TextureUrl);
                      attributes.Diffuse = new MaterialDiffuseMapFeature(new ComputeTextureColor(texture));
                  }
                  else
                  {
                      attributes.Diffuse = new MaterialDiffuseMapFeature(new ComputeColor(Color.Orange));
                  }

                  var model = new CubeProceduralModel { Size = new Vector3(1.2f) }.Generate(Services);
                  model.Materials.Add(Material.New(GraphicsDevice, new MaterialDescriptor { Attributes = attributes }));

                  var cube = new Entity("Cube") { new ModelComponent(model) };
                  cube.Transform.Rotation = Quaternion.RotationYawPitchRoll(0.6f, 0.4f, 0);
                  scene.Entities.Add(cube);

                  SceneSystem.SceneInstance = new SceneInstance(Services, scene);
              }

              protected override void Draw(GameTime gameTime)
              {
                  base.Draw(gameTime);

                  // A few frames before the shot: the first ones can land before the swap chain has
                  // anything in it, and a black PNG would pass a test whose whole job is to be seen.
                  if (++_frames != 30)
                  {
                      return;
                  }

                  using (var image = GraphicsDevice.Presenter.BackBuffer.GetDataAsImage(GraphicsContext.CommandList))
                  using (var stream = File.OpenWrite("screenshot.png"))
                  {
                      image.Save(stream, ImageFileType.Png);
                  }

                  // A file, not a console line: a Stride game's stdout isn't reliably captured, and
                  // this sentinel is the verdict. Reaching it means the engine initialised, the
                  // asset build produced usable content, and a frame with that content is on disk.
                  File.WriteAllText("rendered.ok", $"{_frames} frames, texture {TextureUrl ?? "(none)"}");
                  Exit();
              }
          }
          EOF

      - name: Baseline — the empty game restores and builds
        working-directory: ${{ runner.temp }}/game
        run: dotnet build -c Release

      # ── 3. The store's actual job ──
      - name: Install the asset with the CLI
        working-directory: ${{ runner.temp }}/game
        run: '"$GITHUB_WORKSPACE/tools/strideassetstore" add "$ASSET" --stride "$STRIDE" --yes'

      - name: The asset is listed as installed
        working-directory: ${{ runner.temp }}/game
        run: '"$GITHUB_WORKSPACE/tools/strideassetstore" list'

      - name: Restore and compile the game WITH the asset
        working-directory: ${{ runner.temp }}/game
        run: dotnet build -c Release

      # ── 4. It has to actually run ──
      - name: Run the game
        working-directory: ${{ runner.temp }}/game
        run: |
          # No `timeout` here: macOS doesn't ship it, and on Windows the name collides with a
          # System32 command that does something else entirely. Poll and kill instead, which
          # behaves the same on all three runners.
          rm -f rendered.ok screenshot.png
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1280x720x24" dotnet run -c Release --no-build > run.log 2>&1 &
          else
            dotnet run -c Release --no-build > run.log 2>&1 &
          fi
          PID=$!

          for _ in $(seq 1 150); do
            [ -f rendered.ok ] && break
            kill -0 "$PID" 2>/dev/null || break   # it exited on its own, log tells us why
            sleep 2
          done

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          cat run.log || true

      - name: The game reached a rendered frame
        working-directory: ${{ runner.temp }}/game
        run: |
          [ -f rendered.ok ] \
            || { echo "::error::the game never rendered a frame on ${{ matrix.os }}"; exit 1; }
          echo "rendered OK on ${{ matrix.os }} ($(cat rendered.ok))"

      - name: The frame was captured, and has something in it
        working-directory: ${{ runner.temp }}/game
        run: |
          [ -f screenshot.png ] \
            || { echo "::error::no screenshot.png on ${{ matrix.os }} — the frame rendered but could not be read back"; exit 1; }

          # Size, not existence: a capture that fails halfway leaves a small valid PNG, and an empty
          # file would otherwise pass a check whose entire purpose is that there is an image to see.
          BYTES=$(wc -c < screenshot.png | tr -d ' ')
          echo "screenshot.png is $BYTES bytes"
          [ "$BYTES" -ge 5000 ] \
            || { echo "::error::screenshot.png is $BYTES bytes on ${{ matrix.os }} — too small to be a rendered frame"; exit 1; }

      # Always, not just on failure: the picture is the point of the run, and a green run's
      # screenshots are what let you compare D3D11, llvmpipe and MoltenVK side by side.
      - name: Keep the screenshot and the log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/game/screenshot.png
            ${{ runner.temp }}/game/run.log
          if-no-files-found: ignore

  # One zip instead of three: upload-artifact v4 gives every job its own artifact and cannot append
  # to a shared one, so the matrix is merged afterwards. `always()` because a red run's pictures are
  # the ones worth looking at.
  collect:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/upload-artifact/merge@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-three-platforms
          pattern: e2e-*
          delete-merged: true

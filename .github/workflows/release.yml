name: "Release the desktop apps and the CLI on NuGet"

# Builds the self-contained desktop app for Windows, Linux and macOS and attaches the archives to a
# GitHub Release. Runs on a version tag (e.g. `v0.1.0`) or manual dispatch.
#
# Each build runs on its NATIVE runner (windows/ubuntu/macos), so a green run also proves the app
# compiles, publishes and actually serves on that OS. The download page and the in-app update check
# link to `releases/latest/download/StrideAssetStore-<rid>.<ext>`, so the asset names below must stay stable.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  # Runs here rather than relying on ci.yml: a tag triggers both workflows in parallel, so a red
  # suite there blocked nothing — and a version pushed to nuget.org cannot be taken back.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The schema and validator tests read the registry's schemas from a sibling checkout, and
      # TestPaths fails rather than skipping when CI is set.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Nicogo1705/AssetContainer
          path: AssetContainer
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

  # Creating the release from the matrix could not cover the common case of cutting a release from
  # the GitHub UI: the release already exists and is already published when this workflow starts, so
  # `gh release view` succeeded and --draft was never applied. Doing it once, first, also removes the
  # race between the four legs.
  prepare:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the release as a draft, or take an empty published one back
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          REPO="${{ github.repository }}"
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --generate-notes --repo "$REPO"
            exit 0
          fi

          # It already exists. Only force it back to draft when it carries no archives — the
          # release-from-the-UI case this job is for. Re-running over a release that already shipped
          # would otherwise hide it for the length of the matrix, and releases/latest/download would
          # serve the previous version to everyone meanwhile.
          assets=$(gh release view "$TAG" --repo "$REPO" --json assets -q '.assets | length')
          if [ "$assets" -eq 0 ]; then
            gh release edit "$TAG" --draft=true --repo "$REPO"
          else
            echo "$TAG already has $assets asset(s) — leaving its published state alone."
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, smoke: true }
          - { os: ubuntu-latest, rid: linux-x64, smoke: true }
          - { os: macos-latest, rid: osx-arm64, smoke: true }
          - { os: macos-latest, rid: osx-x64, smoke: false } # cross-arch on the arm64 runner: build only
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Publish (self-contained)
        shell: bash
        run: |
          dotnet publish src/StrideAssetStore.Desktop/StrideAssetStore.Desktop.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:Version=${{ steps.ver.outputs.version }} \
            -o "publish/${{ matrix.rid }}"

      - name: Smoke test (app starts and serves)
        if: matrix.smoke
        shell: bash
        run: |
          DIR="publish/${{ matrix.rid }}"
          BIN="./StrideAssetStore.Desktop"
          [ "${{ runner.os }}" = "Windows" ] && BIN="./StrideAssetStore.Desktop.exe"
          chmod +x "$DIR/${BIN#./}" 2>/dev/null || true
          # Started from its OWN folder: the content root is the working directory, so launching it
          # from elsewhere leaves it looking for a wwwroot that isn't there and serving no static
          # file at all — including the Blazor script. That is how a user runs it, too.
          pushd "$DIR" > /dev/null
          "$BIN" &
          PID=$!
          popd > /dev/null
          OK=0
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:5111/ >/dev/null 2>&1; then OK=1; break; fi
            sleep 2
          done
          # Serving the page is not enough: the Blazor script is what turns that prerendered
          # HTML into a working app, and a 404 on it left v1.3.7..v1.5.2 with dead buttons while
          # this test stayed green. Assert it before shipping the build.
          BLAZOR=0
          if [ "$OK" = "1" ] && curl -fsS http://localhost:5111/_framework/blazor.web.js >/dev/null 2>&1; then BLAZOR=1; fi
          kill "$PID" 2>/dev/null || true
          if [ "$OK" != "1" ]; then echo "::error::app did not serve on ${{ matrix.rid }}"; exit 1; fi
          if [ "$BLAZOR" != "1" ]; then echo "::error::_framework/blazor.web.js is missing on ${{ matrix.rid }} — the app would never become interactive"; exit 1; fi
          echo "served OK on ${{ matrix.rid }} (blazor.web.js present)"

      - name: Package (Windows → .zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "StrideAssetStore-${{ matrix.rid }}.zip"

      - name: Package (Unix → .tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "StrideAssetStore-${{ matrix.rid }}.tar.gz" -C "publish/${{ matrix.rid }}" .

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # The release exists and is a draft: the prepare job saw to that.
          gh release upload "${{ steps.ver.outputs.tag }}" StrideAssetStore-${{ matrix.rid }}.* --clobber

  # The CLI ships to nuget.org as `StrideAssetStore`, so `dotnet tool install -g StrideAssetStore`
  # tracks the same version as the desktop builds. Authentication is NuGet Trusted Publishing
  # (OIDC): no API key is stored anywhere, the token is minted for this workflow on this repo.
  # It needs `id-token: write`, and nuget.org's policy pins this file name — renaming this
  # workflow breaks publishing until the policy is updated.
  publish-cli:
    # After checksums, which is what publishes the release: a version on nuget.org cannot be taken
    # back, and shipping one whose desktop release never became visible strands anyone who installs it.
    needs: [build, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: |
          dotnet pack src/StrideAssetStore.Cli/StrideAssetStore.Cli.csproj \
            -c Release -p:Version=${{ steps.ver.outputs.version }} -o nupkg

      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: Nicogo

      - name: Push
        run: |
          # --skip-duplicate: re-running a release must not fail on a version already pushed.
          dotnet nuget push nupkg/*.nupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  # Builds are unsigned, so publish checksums users can verify against (also linked
  # from the storefront's Download page). Runs once, after every matrix leg uploaded.
  checksums:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate and attach SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "StrideAssetStore-*"
          sha256sum StrideAssetStore-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber --repo "${{ github.repository }}"

          # Publish last, once every archive and the checksums are attached. v0.9.0 shipped as a
          # draft: invisible, and releases/latest/download/... resolves to nothing, so the in-app
          # update check and `app install` both see a release with no build for their machine.
          # Doing it here also means a half-finished release is never the "latest" one.
          gh release edit "$TAG" --draft=false --latest --repo "${{ github.repository }}"

  # A release that never became visible is the failure mode worth shouting about: the tag is pushed,
  # the Releases tab looks empty, and releases/latest/download keeps serving the previous version.
  # It depends on every job that can leave it that way — depending on `build` alone missed the most
  # likely one, since `checksums` is what actually publishes.
  report-release-not-published:
    needs: [build, checksums, publish-cli]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report what state the release is actually in
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          REPO="${{ github.repository }}"

          # Asked, not assumed: this job also runs when `test` failed and nothing was built, and a
          # release cut from the GitHub UI is public and empty in that case — not a draft.
          if ! state=$(gh release view "$TAG" --repo "$REPO" --json isDraft,assets 2>/dev/null); then
            echo "::error::$TAG failed to build and no release exists for it. Fix the failure and re-run."
            exit 0
          fi

          draft=$(echo "$state" | jq -r '.isDraft')
          assets=$(echo "$state" | jq -r '.assets | length')
          if [ "$draft" = "true" ]; then
            echo "::error::$TAG is still a DRAFT with $assets asset(s): invisible, and releases/latest/download serves the previous version. Fix the failure and re-run."
          else
            echo "::error::$TAG is PUBLISHED with $assets asset(s), which may be incomplete. Check it before announcing."
          fi
